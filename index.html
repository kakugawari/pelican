<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぱくぱくペリカン</title>
<meta name="description" content="えさのカードを、数の大きさで取りあう カードゲーム">
<meta name="theme-color" content="#0883f2">
<!-- ホーム画面に追加して開いたとき、時計や電池の帯の下まで画面を描く (CLAUDE.md の落とし穴の表) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- タイトル -->
<section id="title" class="screen">
  <!-- 使う人が描いたタイトルの絵。ボタンも絵に描いてあるので、その上に透明な当たりを重ねる。
       絵と当たりは同じ入れ物 (.tart) に入れ、画面の大きさに合わせて入れ物ごと縮める -->
  <div class="tart" id="tart">
    <img src="img/title.webp" alt="ぱくぱくペリカン" draggable="false">
    <button id="toSetup" class="hit" style="left:18.5%;top:77.8%;width:63%;height:9%" aria-label="あそぶ"></button>
    <button id="toRules" class="hit" style="left:28%;top:87.7%;width:44%;height:6%" aria-label="ルール"></button>
  </div>
</section>

<!-- だれと あそぶか -->
<section id="setup" class="screen" hidden>
  <h2>だれと あそぶ?</h2>
  <div id="seats"></div>
  <p class="note" id="setupNote"></p>
  <div class="tbtns">
    <button id="start" class="btn big">はじめる</button>
    <button id="setupBack" class="btn ghost">もどる</button>
  </div>
</section>

<!-- ゲーム -->
<section id="game" class="screen" hidden>
  <header id="bar">
    <button id="quit" class="chip-btn">やめる</button>
    <div id="round"></div>
    <button id="rulesInGame" class="chip-btn">ルール</button>
  </header>
  <div id="players"></div>
  <div id="field">
    <div id="food"></div>
    <div id="say"></div>
  </div>
  <div id="hand"></div>
  <div id="info"><span id="infoTxt"></span><button id="go" class="btn" hidden>これを 出す</button></div>
</section>

<!-- 知らせ (順番の交代・結果・ルール) -->
<div id="modal" class="ov" hidden><div class="box" id="modalBox"></div></div>

<script src="./core.js"></script>
<script src="./app.js"></script>
</body>
</html>
