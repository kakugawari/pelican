<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぱくぱくペリカン</title>
<meta name="description" content="ペリカンのカードを、数の大きさで取りあう カードゲーム">
<meta name="theme-color" content="#0883f2">
<!-- ホーム画面に追加して開いたとき、時計や電池の帯の下まで画面を描く (CLAUDE.md の落とし穴の表) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- タイトル -->
<section id="title" class="screen">
  <!-- 使う人が描いたタイトルの絵。ボタンも絵に描いてあるので、その上に透明な当たりを重ねる。
       絵と当たりは同じ入れ物 (.tart) に入れ、画面の大きさに合わせて入れ物ごと縮める -->
  <div class="tart" id="tart">
    <img src="img/title.webp" alt="ぱくぱくペリカン" draggable="false">
    <!-- 動き: 太陽が光り、題字に星がまたたき、海がきらめく。絵の上に重ねるだけ (タップは下へ通す) -->
    <div class="tfx" aria-hidden="true">
      <i class="sun"></i><i class="rays"></i>
      <i class="star" style="left:10%;top:6.5%"></i><i class="star" style="left:86%;top:13.5%;animation-delay:.8s"></i>
      <i class="star" style="left:47%;top:3.2%;animation-delay:1.6s"></i><i class="star s" style="left:22%;top:21%;animation-delay:2.3s"></i>
      <i class="star s" style="left:76%;top:23%;animation-delay:1.1s"></i>
      <i class="glint" style="left:12%;top:56%"></i><i class="glint" style="left:30%;top:60%;animation-delay:.9s"></i>
      <i class="glint" style="left:68%;top:57%;animation-delay:1.7s"></i><i class="glint" style="left:88%;top:61%;animation-delay:2.5s"></i>
      <i class="glint" style="left:52%;top:63%;animation-delay:3.2s"></i>
    </div>
    <button id="toSetup" class="hit" style="left:18.5%;top:77.8%;width:63%;height:9%" aria-label="あそぶ"><i class="shine"></i></button>
    <button id="toRules" class="hit" style="left:28%;top:87.7%;width:44%;height:6%" aria-label="ルール"></button>
  </div>
</section>

<!-- だれと あそぶか -->
<section id="setup" class="screen" hidden>
  <h2>だれと あそぶ?</h2>
  <div id="seats"></div>
  <p class="note" id="setupNote"></p>
  <div class="tbtns">
    <button id="start" class="btn big">はじめる</button>
    <button id="setupBack" class="btn ghost">もどる</button>
  </div>
</section>

<!-- ゲーム -->
<section id="game" class="screen" hidden>
  <header id="bar">
    <button id="quit" class="chip-btn">やめる</button>
    <div id="round"></div>
    <div class="barR"><button id="snd" class="chip-btn icon" aria-label="おと"></button><button id="rulesInGame" class="chip-btn">ルール</button></div>
  </header>
  <div id="players"></div>
  <div id="field">
    <div id="food"></div>
    <div id="say"></div>
  </div>
  <div id="hand"></div>
  <div id="info"><span id="infoTxt"></span><button id="go" class="btn" hidden>これを 出す</button></div>
</section>

<!-- 知らせ (順番の交代・結果・ルール) -->
<div id="modal" class="ov" hidden><div class="box" id="modalBox"></div></div>

<script src="./core.js"></script>
<script src="./app.js"></script>
</body>
</html>
